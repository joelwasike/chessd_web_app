<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3E2723" />
    <meta name="description" content="Chessd - Competitive Chess Platform. Play online, challenge friends, climb the leaderboard." />
    <title>Chessd — Play Chess</title>
    <!-- Preload fonts to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" media="print" onload="this.media='all'" />
    <style>
      /* Instant loading screen before JS loads */
      body { margin: 0; background: #1A0F0A; }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        flex-direction: column;
        gap: 16px;
      }
      #root:empty::before {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(212,160,60,0.2);
        border-top-color: #D4A03C;
        border-radius: 50%;
        animation: sp 0.8s linear infinite;
      }
      #root:empty::after {
        content: 'Chessd';
        font-family: Georgia, serif;
        font-size: 24px;
        color: #D4A03C;
        letter-spacing: 2px;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
